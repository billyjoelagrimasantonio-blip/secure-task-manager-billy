<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Dynamic Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <section class="app">
            <header class="header">
                <h1>Secure Dynamic Task Manager</h1>
                <p class="subtitle">Create, edit, complete, and remove your tasks securely.</p>
            </header>

            <section class="task-form">
                <div class="input-group">
                    <input
                        type="text"
                        id="taskInput"
                        placeholder="Enter a task"
                    >

                    <button type="button" id="addTaskBtn">
                        Add Task
                    </button>

                    <button type="button" id="loadSamplesBtn">
                        Load Sample Tasks
                    </button>
                </div>

                <p id="taskMessage" class="message"></p>
            </section>

            <section class="summary">
                <div class="summary-card">
                    <span>Total Tasks</span>
                    <strong id="totalCount">0</strong>
                </div>

                <div class="summary-card">
                    <span>Pending</span>
                    <strong id="pendingCount">0</strong>
                </div>

                <div class="summary-card">
                    <span>Completed</span>
                    <strong id="completedCount">0</strong>
                </div>
            </section>

            <section class="tasks-section">
                <h2>Task List</h2>
                <ul id="taskList"></ul>
            </section>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
